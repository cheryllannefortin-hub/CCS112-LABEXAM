<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nanay Cely's Karinderya</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #fff8e7;
        }
        header {
            background-color: #d35400;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .container {
            padding: 20px;
        }
        .menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        .item {
            background-color: white;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .item h3 {
            margin: 0 0 10px;
        }
        footer {
            background-color: #d35400;
            color: white;
            text-align: center;
            padding: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<header>
    <h1>🍛 Nanay Cely's Karinderya</h1>
    <p>Lutong bahay, presyong pang-masa</p>
</header>

<div class="container">
    <h2>📋 Menu Ngayon</h2>

    <div class="menu">
        <div class="item">
            <h3>Adobong Manok</h3>
            <p>Presyo: ₱70</p>
        </div>

        <div class="item">
            <h3>Sinigang na Baboy</h3>
            <p>Presyo: ₱80</p>
        </div>

        <div class="item">
            <h3>Pinakbet</h3>
            <p>Presyo: ₱50</p>
        </div>

        <div class="item">
            <h3>Fried Bangus</h3>
            <p>Presyo: ₱75</p>
        </div>
    </div>
</div>

<footer>
    <p>📍 Brgy. Masaya | ☎️ 0912-345-6789</p>
    <p>© 2026 Nanay Cely's Karinderya</p>
</footer>

</body>
</html>
